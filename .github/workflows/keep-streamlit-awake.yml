name: Visit Streamlit app

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/keep-streamlit-awake.yml
      - scripts/visit_streamlit.py
  schedule:
    - cron: "17 1,5,9,13,17,21 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Visit app
        run: python scripts/visit_streamlit.py https://harsh-finance.streamlit.app/
