[theme]
font = "'Schibsted Grotesk':https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..900&display=swap"
baseRadius = "small"

[theme.light]
primaryColor = "#a8680a"
backgroundColor = "#f7f7f5"
secondaryBackgroundColor = "#ecece8"
textColor = "#1b1d20"

[theme.dark]
primaryColor = "#e3a63a"
backgroundColor = "#161718"
secondaryBackgroundColor = "#222325"
textColor = "#e9e8e4"
